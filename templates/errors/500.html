<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F8FAFC; padding: 20px;">
    <div style="text-align: center; max-width: 440px; background: #ffffff; padding: 40px 32px; border-radius: var(--radius-xl); box-shadow: var(--shadow-pastel); border: 1px solid var(--border-light);">
        <div style="width: 64px; height: 64px; background: var(--rose-100); color: var(--rose-600); border-radius: var(--radius-lg); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
            <i data-lucide="alert-octagon" style="width: 32px; height: 32px;"></i>
        </div>
        <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-primary); margin-bottom: 8px;">500</h1>
        <h2 style="font-size: 1.15rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px;">Internal Server Error</h2>
        <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 24px;">An unexpected error occurred while processing your request. Please ensure MySQL is running and check your connection settings.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary" style="width: 100%;">
            <i data-lucide="refresh-cw"></i>
            <span>Back to Safety</span>
        </a>
    </div>
    <script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
